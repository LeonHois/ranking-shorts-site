<h1>Almost done</h1>
<p>Copy the full address below, then paste it into the GitHub workflow <strong>"Connect TikTok"</strong>
(step <code>finish</code>). It is valid for only a few minutes.</p>
<div class="box" id="url">...</div>
<button id="copy">Copy address</button> <span id="ok"></span>
<p style="color:#666;font-size:.9rem">This page does not send the address anywhere; it only shows it in your browser.</p>
<script>
var u=location.href;document.getElementById('url').textContent=u;
document.getElementById('copy').onclick=function(){
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){document.getElementById('ok').textContent='Copied';},
  function(){var r=document.createRange();r.selectNodeContents(document.getElementById('url'));var s=getSelection();s.removeAllRanges();s.addRange(r);
  document.getElementById('ok').textContent='Selected - tap Copy in the menu';});};
</script></body></html>
